---
- name: Wait for every instance to accept SSH
  hosts: all
  gather_facts: false

  tasks:
    - name: Wait for the connection
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

- name: Configure the storage tier
  hosts: nfs
  become: true
  roles:
    - nfs_server

- name: Configure the database tier
  hosts: database
  become: true
  roles:
    - database

- name: Configure the web tier
  hosts: web
  become: true
  roles:
    - wordpress

- name: Configure the load balancer
  hosts: loadbalancer
  become: true
  roles:
    - loadbalancer
